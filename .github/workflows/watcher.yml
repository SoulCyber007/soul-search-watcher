name: soul-search-watcher
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python watcher.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name "soul-search-watcher"; git config user.email "watcher@users.noreply.github.com"
          git add queue.json state.json; git diff --cached --quiet || (git commit -m "watcher run" && git push)
